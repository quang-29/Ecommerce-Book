version: '3.8'

services:
  app:
    build: .
    container_name: bookstore-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3308/bookstore
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: minhquang
      TZ: Asia/Ho_Chi_Minh
    depends_on:
      - db
    networks:
      - bookstore-network

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: bookstore
      MYSQL_ROOT_PASSWORD: minhquang
    ports:
      - "3308:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - bookstore-network

volumes:
  mysql-data: {}

networks:
  bookstore-network:
    driver: bridge
