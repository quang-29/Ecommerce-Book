spring:
  application:
    name: BookStore

  datasource:
    url: jdbc:mysql://localhost:3308/bookstore?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
    username:
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 2000ms
      ssl:
        enabled: false
      repositories:
        enabled: false

# JWT
jwt:
  signing:
    key: ${JWT_SIGNING_KEY:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}

app:
  jwt:
    secret: ${APP_JWT_SECRET:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    expiration-in-ms: ${APP_JWT_EXPIRATION_IN_MS:900000}
    refresh-expiration-in-ms: ${APP_JWT_REFRESH_EXPIRATION_IN_MS:604800000}

  cors:
    allowedOrigins: http://localhost:3000

# Cloudinary
cloudinary:
  cloud-name:
  api-key:
  api-secret:

# AWS S3
aws:
  s3:
    bucketName: BookStore
    secret:
      key:
    access:
      key:

# VNPay
payment:
  vnPay:
    url:
    tmnCode:
    secretKey:
    returnUrl:
    version:
    command:
    orderType:
    max_time:

# GHN
GHN:
  TOKEN:
  SHOPID:

# Base URL
baseUrl: http://localhost:8080

# Chat API
chat:
  api:
    key:
    endpoint:
